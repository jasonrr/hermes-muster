name: muster
version: "0.1.0"
description: Brings human-directed coding agents into your workflow. An approved GitHub issue or an ad-hoc request becomes a Claude Code run in a herdr worktree pane, tracked on a Hermes kanban card; questions, design approvals, build reviews and merges are decided in Telegram or Slack, and finished workspaces are cleaned up. Disclosure — shells out to gh, git, herdr and hermes; starts interactive agent panes on this machine; uses your gh login (or a GH_CONFIG_DIR you name); writes worktrees under ~/.herdr/worktrees and removes finished ones after backing up unsaved work; registers Telegram callback guards or Slack action handlers, for the selected platform only, and a pre_gateway_dispatch hook in the gateway; presents decisions with Hermes's own clarify prompts and approval cards on Telegram, and its own Block Kit messages on Slack; with notify_topics, keeps one Telegram forum topic or Slack thread per run; merges a pull request only on an approver's tap.
manifest_version: 2
provides_hooks: [pre_gateway_dispatch]
license: MIT
requires_hermes: ">=0.21.5"
config_schema:
  label: {type: str, default: agent-ready, description: Label whose application by the approver authorizes work}
  bug_label: {type: str, default: bug, description: Issues carrying it are briefed as bugs}
  approver_login: {type: str, default: "", required: true, description: GitHub login allowed to approve (case-insensitive)}
  approver_id: {type: int, default: 0, required: true, description: "Numeric GitHub id of the approver (gh api user --jq .id)"}
  auto_approvers: {type: list, default: [], description: "Bots whose own label starts work: [{login, id, label, repos}]; see docs/setup.md"}
  repos: {type: list, default: [], required: true, description: "owner/name or owner/name=/abs/clone/path"}
  clone_root: {type: str, default: "~/Code", description: Where owner/name clones live when no path is given}
  board: {type: str, default: muster, description: Hermes kanban board slug; give muster its own board}
  agent_kind: {type: str, default: claude, choices: [claude], description: Coding agent CLI (v1 claude only)}
  agent_model: {type: str, default: opus, description: Model passed to the agent CLI}
  branch_prefix: {type: str, default: "muster/", description: Issue branches are <prefix><number>}
  notify_platform: {type: str, default: telegram, choices: [telegram, slack]}
  notify_chat_id: {type: str, default: "", description: "Telegram: empty = DM the TELEGRAM_HOME_CHANNEL from $HERMES_HOME/.env. Slack: the channel id, required"}
  notify_user_id: {type: str, default: "", description: "Who may answer: one id, or approver ids separated by commas"}
  notify_chat_type: {type: str, default: group}
  notify_topics: {type: bool, default: false, description: "One forum topic (Telegram) or thread (Slack) per run in the notify_chat_id chat; see docs/channels.md"}
  coordinator_name: {type: str, default: Coordinator, description: "The Hermes agent's name in muster's messages (\"Ella is reviewing\")"}
  gh_config_dir: {type: str, default: "", description: Optional GH_CONFIG_DIR for a bot login used by gh/git in the pane}
  notes_dir: {type: str, default: "", description: Per-repo production notes; empty = plugin-data/muster/repos}
  workflow_prompt_file: {type: str, default: "", description: Replaces prompts/builder-workflow.md in every brief}
  worktrees: {type: str, default: "~/.herdr/worktrees"}
  project_owner: {type: str, default: "", description: "Optional GitHub Project (v2) owner; with project_number, its status moves on launch. Empty = off"}
  project_number: {type: int, default: 0, description: "That Project's number (gh project view <number> --owner <owner>); set both or neither"}
  project_status_field: {type: str, default: Status, description: Single-select field set on launch}
  project_status_value: {type: str, default: In Progress, description: Option the field is set to}
