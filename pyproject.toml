[project]
name = "hermes-muster"
version = "0.1.0"
description = "A Hermes plugin: one named human labels a GitHub issue, muster gathers a coding agent in a herdr pane to work it."
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
