[project]
name = "hermes-muster"
version = "0.1.0"
description = "A Hermes plugin that brings human-directed coding agents into your workflow, from dispatch and design approval through review and cleanup, with decisions in Telegram or Slack and the work visible in herdr."
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
